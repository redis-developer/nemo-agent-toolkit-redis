[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69", "setuptools-scm>=8"]

[project]
name = "nemo-agent-toolkit-redis"
dynamic = ["version"]
requires-python = ">=3.11,<3.14"
description = "Redis Agent Memory integration for NVIDIA NeMo Agent Toolkit"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Redis" }]
maintainers = [{ name = "Redis" }]
keywords = ["ai", "agents", "memory", "redis", "nemo", "nat"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "agent-memory-client>=0.14.0,<1.0.0",
  "langchain-core>=0.3.0,<2.0.0",
  "nvidia-nat-core>=1.5.0,<2.0.0",
  "redis>=4.3.4,<5.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "testcontainers>=4.3.1,<5",
]

[project.urls]
documentation = "https://github.com/redis-developer/nvidia-nat-redis/tree/main/docs"
issues = "https://github.com/redis-developer/nvidia-nat-redis/issues"
source = "https://github.com/redis-developer/nvidia-nat-redis"

[project.entry-points.'nat.components']
nat_redis = "nat.plugins.redis.register"

[dependency-groups]
dev = [
  "nvidia-nat-langchain>=1.5.0,<2.0.0",
  "ruff>=0.15.0,<0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nvidia_nat_redis*", "nat.plugins*"]

[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"

[tool.uv]
managed = true
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
