general:
  telemetry:
    enabled: false

llms:
  openai_llm:
    _type: openai
    model_name: ${NAT_OPENAI_MODEL:-gpt-4o-mini}
    temperature: 0.7
    max_tokens: 1024

memory:
  redis_memory:
    _type: redis_agent_memory_backend
    base_url: ${REDIS_AGENT_MEMORY_URL:-http://localhost:8000}
    default_namespace: ${REDIS_AGENT_MEMORY_NAMESPACE:-nat-tool-memory}

functions:
  get_memory:
    _type: get_memory
    memory: redis_memory
    description: |
      Always check memory for user preferences before answering.
      Use the active user_id from the conversation context.

  add_memory:
    _type: add_memory
    memory: redis_memory
    description: |
      Add durable user preferences and facts to long-term memory whenever the
      user shares them.

workflow:
  _type: react_agent
  tool_names: [get_memory, add_memory]
  description: "A chat agent using Redis Agent Memory for long-term memory"
  llm_name: openai_llm
